[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "confpaper"
version = "0.2.0"
description = "AI/CV conference paper search and download tool"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6",
    "rapidfuzz>=3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "bibtexparser>=2",
]
phase3 = [
    "openreview-py>=1.4",
]

[project.scripts]
confpaper = "confpaper.cli:app"

[tool.ruff]
target-version = "py310"
